<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <title>اپیزودها — WE WERE HERE</title>
  <link rel="icon" href="/assets/wwh-favicon.jpg?v=1" type="image/jpeg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.jpg?v=1">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/wwh-theme.css">
  <link rel="stylesheet" href="/assets/wwh-shell.css">
  <style>
    body { font-family: var(--font, 'Vazirmatn', sans-serif); background: var(--color-bg); color: var(--color-text); margin: 0; line-height: 1.7; }
    .wwh-page-main { max-width: 720px; margin: 0 auto; padding: 16px 20px calc(48px + env(safe-area-inset-bottom, 0px)); }
    h1 { font-weight: 800; margin-bottom: 8px; }
    .muted { color: var(--color-muted); font-size: 0.9rem; }
    .grid { display: grid; gap: 16px; margin-top: 28px; }
    .card {
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 20px;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
    }
    .card__ep {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--color-accent-soft);
      margin-bottom: 8px;
    }
    .card h2 { font-size: 1.1rem; margin: 0 0 6px; }
    .card__meta { font-size: 0.85rem; color: var(--color-secondary); margin: 0; }
    .badge {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--color-accent);
      background: rgba(212, 63, 90, 0.12);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>
  <div id="wwh-topbar-mount"></div>

  <main class="wwh-page-main">
    <h1>اپیزودهای WE WERE HERE</h1>
    <p class="muted">هر اجرا یک فصل از تاریخچه پروژه است.</p>
    <div class="grid" id="episodes-grid"><p class="muted">در حال بارگذاری…</p></div>
  </main>

  <div id="wwh-footer-mount"></div>

  <script src="/assets/wwh-datetime.js"></script>
  <script src="/assets/wwh-chrome.js"></script>
  <script>
    var FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
    function toPersian(n) {
      return String(n).replace(/\d/g, function (d) { return FA_DIGITS[d]; });
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function formatEventAt(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });
    }
    fetch('/api/events')
      .then(function (r) { return r.json(); })
      .then(function (res) {
        var grid = document.getElementById('episodes-grid');
        if (!res.events || !res.events.length) {
          grid.innerHTML = '<p class="muted">هنوز رویداد عمومی ثبت نشده.</p>';
          return;
        }
        grid.innerHTML = res.events.map(function (ev) {
          var epLabel = ev.episodeNumber != null
            ? ('اپیزود ' + toPersian(ev.episodeNumber))
            : 'اپیزود';
          var metaParts = [];
          var when = formatEventAt(ev.eventAt);
          if (when) metaParts.push(when);
          if (ev.city) metaParts.push(ev.city);
          if (ev.venue) metaParts.push(ev.venue);
          var featured = ev.isFeatured
            ? '<span class="badge">همین اجرا</span>'
            : '';
          return (
            '<article class="card">' +
            '<span class="card__ep">' + escapeHtml(epLabel) + '</span>' +
            '<h2>' + escapeHtml(ev.title || 'اپیزود') + '</h2>' +
            (metaParts.length ? '<p class="card__meta">' + escapeHtml(metaParts.join(' · ')) + '</p>' : '') +
            featured +
            '</article>'
          );
        }).join('');
      })
      .catch(function () {
        document.getElementById('episodes-grid').innerHTML = '<p class="muted">بارگذاری ناموفق بود.</p>';
      });
  </script>
</body>
</html>
