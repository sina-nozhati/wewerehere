<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <title>اپیزودها — WE WERE HERE</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/wwh-theme.css">
  <link rel="stylesheet" href="/assets/wwh-shell.css">
  <style>
    body { font-family: var(--font, 'Vazirmatn', sans-serif); background: var(--color-bg); color: var(--color-text); margin: 0; line-height: 1.7; }
    .wwh-page-main { max-width: 720px; margin: 0 auto; padding: 16px 20px calc(48px + env(safe-area-inset-bottom, 0px)); }
    h1 { font-weight: 800; margin-bottom: 8px; }
    .muted { color: var(--color-muted); font-size: 0.9rem; }
    a.card-link { color: inherit; text-decoration: none; display: block; }
    .grid { display: grid; gap: 16px; margin-top: 28px; }
    .card { border: 1px solid var(--color-border); background: var(--color-surface); border-radius: var(--radius-md); padding: 20px; transition: border-color 200ms ease; }
    .card h2 { font-size: 1.1rem; margin: 0 0 6px; }
    .card:active { transform: scale(0.99); }
    .badge { font-size: 0.72rem; color: var(--color-secondary); }
    @media (hover: hover) and (pointer: fine) {
      .card:hover { border-color: var(--color-accent); }
    }
  </style>
</head>
<body>
  <div id="wwh-topbar-mount"></div>

  <main class="wwh-page-main">
    <h1>اپیزودهای WE WERE HERE</h1>
    <p class="muted">هر اجرا یک فصل از تاریخچه پروژه است.</p>
    <div class="grid" id="episodes-grid"><p class="muted">در حال بارگذاری…</p></div>
  </main>

  <div id="wwh-footer-mount"></div>

  <script src="/assets/wwh-datetime.js"></script>
  <script src="/assets/wwh-chrome.js"></script>
  <script>
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    fetch('/api/events')
      .then(function (r) { return r.json(); })
      .then(function (res) {
        var grid = document.getElementById('episodes-grid');
        if (!res.events || !res.events.length) {
          grid.innerHTML = '<p class="muted">هنوز رویداد عمومی ثبت نشده.</p>';
          return;
        }
        grid.innerHTML = res.events.map(function (ev) {
          var href = ev.slug ? ('/?event=' + encodeURIComponent(ev.slug)) : '/';
          return (
            '<a class="card-link" href="' + href + '">' +
            '<article class="card">' +
            '<h2>' + escapeHtml(ev.title || 'اپیزود') + '</h2>' +
            '<span class="badge">' + escapeHtml(ev.city || '') + '</span>' +
            '</article></a>'
          );
        }).join('');
      })
      .catch(function () {
        document.getElementById('episodes-grid').innerHTML = '<p class="muted">بارگذاری ناموفق بود.</p>';
      });
  </script>
</body>
</html>
